<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SIGINT OPS intelligence signals and mission status dashboard."
    />
    <title>SIGINT OPS | Intelligence Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand-mark" href="#" aria-label="SIGINT OPS home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.8 4.2 6v5.5c0 5.1 3.3 8.4 7.8 10.2 4.5-1.8 7.8-5.1 7.8-10.2V6L12 2.8Z" />
            <path d="M12 7.2 9 13h2.5l-.6 4 4.1-6h-2.6l1-3.8Z" />
          </svg>
        </a>
        <p class="brand-name">SIGINT OPS</p>
        <div class="secure-badge">
          <span class="secure-dot" aria-hidden="true"></span>
          SECURE ONLINE
        </div>
      </header>

      <main class="dashboard">
        <section class="overview-panel" aria-label="Signal overview">
          <div class="radar" >
            <div class='sweep'></div>
          </div>
          <div class="overview-stats">
            <div class="stat">
              <span class="stat-value">24</span>
              <span class="stat-label">ACTIVE SIGNALS</span>
            </div>
            <div class="stat">
              <span class="stat-value">07</span>
              <span class="stat-label">PRIORITY ALERTS</span>
            </div>
          </div>
        </section>

        <section class="actions" aria-label="Quick actions">
          <button class="action-button" type="button" data-message="New brief request opened">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m13.4 2.8-9 10.1h6l-.8 8.3 10-11.5h-6.3l.1-6.9Z" />
            </svg>
            <span>New Brief</span>
          </button>
          <button class="action-button" type="button" data-message="Signal decoder ready">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8.5 6-6 6 6 6M15.5 6l6 6-6 6" />
            </svg>
            <span>Decode</span>
          </button>
          <button class="action-button" type="button" data-message="Drone request sent">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 11 18-8-7.5 18-2.2-7.3L3 11Z" />
              <path d="m11.3 13.7 5-5" />
            </svg>
            <span>Request Drone</span>
          </button>
        </section>

        <section class="missions" aria-label="Incoming intelligence reports">
          <article class="mission-card mission-critical">
            <div class="mission-topline">
              <span class="priority priority-critical">CRITICAL</span>
              <span class="mission-status">In Progress</span>
            </div>
            <h2>Operation Nightfall</h2>
            <div class="progress-row">
              <div class="progress-track" role="progressbar" aria-label="Operation Nightfall progress" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">
                <span style="width: 65%"></span>
              </div>
              <span class="progress-value">65%</span>
            </div>
          </article>

          <article class="mission-card mission-high">
            <div class="mission-topline">
              <span class="priority priority-high">HIGH</span>
              <span class="mission-status">Analyzing</span>
            </div>
            <h2>Signal Intercept Alpha</h2>
            <div class="progress-row">
              <div class="progress-track" role="progressbar" aria-label="Signal Intercept Alpha progress" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
                <span style="width: 40%"></span>
              </div>
              <span class="progress-value">40%</span>
            </div>
          </article>

          <article class="mission-card mission-medium">
            <div class="mission-topline">
              <span class="priority priority-medium">MEDIUM</span>
              <span class="mission-status">Pending</span>
            </div>
            <h2>Asset Recovery</h2>
            <div class="progress-row">
              <div class="progress-track" role="progressbar" aria-label="Asset Recovery progress" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100">
                <span style="width: 15%"></span>
              </div>
              <span class="progress-value">15%</span>
            </div>
          </article>

          <article class="mission-card mission-high">
            <div class="mission-topline">
              <span class="priority priority-high">HIGH</span>
              <span class="mission-status">Active</span>
            </div>
            <h2>Cyber Defense Grid</h2>
            <div class="progress-row">
              <div class="progress-track" role="progressbar" aria-label="Cyber Defense Grid progress" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
                <span style="width: 80%"></span>
              </div>
              <span class="progress-value">80%</span>
            </div>
          </article>
        </section>

        <div class="threat-banner" role="status">
          <span class="threat-indicator" aria-hidden="true"></span>
          <strong>THREAT DETECTED</strong>
        </div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item is-active" type="button" aria-current="page" data-view="Dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 13h4l3-8 4 14 3-8h4" />
        </svg>
        <span>Dashboard</span>
        <span class="nav-underline" aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-view="Feed">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 9a10 10 0 0 0 0 6M8 11a5 5 0 0 0 0 2m11-4a10 10 0 0 1 0 6m-3-4a5 5 0 0 1 0 2M12 12h.01" />
        </svg>
        <span>Feed</span>
        <span class="nav-underline" aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-view="Brief">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" />
          <path d="M14 3v5h5M9 13h6m-6 4h6" />
        </svg>
        <span>Brief</span>
        <span class="nav-underline" aria-hidden="true"></span>
      </button>
      <button class="help-button" type="button" aria-label="Help" data-message="SIGINT OPS dashboard help">
        ?
      </button>
    </nav>

    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
